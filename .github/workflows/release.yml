name: release

# Two ways to release:
#  - push a tag like v0.0.1;
#  - run this workflow manually (Actions -> release -> Run workflow) with a tag
#    name: if the tag does not exist yet, the release is built from the
#    selected branch and `gh release create --target` creates the tag on
#    GitHub. If it exists, that tag is rebuilt and its assets replaced.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.0.1 (created from the selected branch if missing)"
        required: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.5.1

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select the commit to build
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "refs/tags/$TAG"
          fi
          echo "TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log --oneline -1
      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-windows-linux-web
      - name: Install Godot and templates
        run: |
          tools/install-godot.sh --templates
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tests and walkthrough
        run: tools/test.sh
      - name: Export
        run: tools/export.sh windows linux web
      - name: Package
        run: tools/package.sh "$TAG"
      - name: Install Wine (to run the Windows build)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine64 xvfb
      - name: Smoke-test the packages (Linux natively, Windows under Wine)
        run: tools/smoke.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(mktemp)"
          cat > "$notes" <<NOTES
          First-person exploration of Panticapaeum, 4th century BCE, in a PlayStation-era style (Godot ${GODOT_VERSION}).

          **Windows:** unzip and run \`Panticapaeum.exe\`. It is not code-signed: if SmartScreen says "Windows protected your PC", click *More info* → *Run anyway*. If it does not start, run \`Panticapaeum.console.exe\` to see the engine log.
          **Linux:** \`tar xzf\` and run \`./panticapaeum.x86_64\`.
          **Browser:** https://stadytady.github.io/metridat-game/

          Controls: WASD, mouse, Shift run, Space jump, E inspect, Esc pause, F3 performance overlay.
          Measure performance: \`Panticapaeum.exe -- --benchmark\` (results in \`%APPDATA%\\Godot\\app_userdata\\Panticapaeum- Echoes of the Bosporus\\benchmark.txt\`).

          Checked in CI: unit tests and a scripted walkthrough of the whole scene, then the same walkthrough in the unpacked release packages: Linux natively, Windows under Wine. Not checked: real Windows hardware and GPUs.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$TARGET" --title "Panticapaeum ${TAG}" --notes-file "$notes"
          fi
