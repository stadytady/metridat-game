name: release

# Two ways to release:
#  - push a tag like v0.0.1;
#  - run this workflow manually (Actions -> release -> Run workflow) with a tag
#    name: if the tag does not exist yet, the release is built from the
#    selected branch and `gh release create --target` creates the tag on
#    GitHub. If it exists, that tag is rebuilt and its assets replaced.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.0.1 (created from the selected branch if missing)"
        required: true
      trailer_only:
        description: "Only replace the trailer of an existing release with docs/trailer.mp4 from the selected branch"
        type: boolean
        default: false

permissions:
  contents: read

env:
  GODOT_VERSION: 4.5.1

jobs:
  # A re-rendered trailer for a release already out: the packages stay as they
  # are (built from the tag), only the trailer and its checksum are replaced.
  trailer:
    if: ${{ inputs.trailer_only }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Replace the trailer and its checksum
        run: |
          name="Panticapaeum-${TAG}-trailer.mp4"
          cp docs/trailer.mp4 "$name"
          gh release download "$TAG" --pattern SHA256SUMS.txt --clobber
          grep -v -- "-trailer.mp4" SHA256SUMS.txt > sums.new || true
          sha256sum "./$name" >> sums.new  # same form as tools/package.sh writes
          sort -k2 sums.new > SHA256SUMS.txt
          gh release upload "$TAG" "$name" SHA256SUMS.txt --clobber
          cat SHA256SUMS.txt

  release:
    if: ${{ !inputs.trailer_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select the commit to build
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "refs/tags/$TAG"
          fi
          echo "TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log --oneline -1
      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-windows-linux-web
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-bin-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Install Godot and templates
        run: |
          tools/install-godot.sh --templates
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tests and walkthrough
        run: tools/test.sh
      - name: Export
        run: tools/export.sh windows linux web
      - name: Package
        run: tools/package.sh "$TAG"
      - name: Month (the apt cache is renewed monthly, after the runner image moves on)
        id: month
        run: echo "ym=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache apt packages (wine)
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt
          key: apt-ubuntu-24.04-wine-${{ steps.month.outputs.ym }}
          restore-keys: apt-ubuntu-24.04-wine-
      - name: Install Wine (to run the Windows build)
        # From the cached .debs when they are there (no network); else from the
        # mirror, each try with a deadline: it sometimes stalls for many minutes.
        timeout-minutes: 15
        run: |
          tools/apt-cached.sh wine wine64 xvfb
          command -v wine
      - name: Smoke-test the packages (Linux natively, Windows under Wine)
        run: tools/smoke.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(mktemp)"
          cat > "$notes" <<NOTES
          First-person exploration of Panticapaeum, 4th century BCE, in a PlayStation-era style (Godot ${GODOT_VERSION}).

          Walk down from the hill above the strait through the Street of the Jars and the agora, past the potter's workshop and the fisherman's camp on the beach, up to the sanctuary of Hecate. Sixteen finds, each turnable in close-up, keep sourced history apart from the game's own fiction. Every find brings the evening on and the ships in to anchor; at night, light the lamps, lie down in Hecate's abaton and follow the dream. EN / RU.

          New in v0.0.10: strike your own stater at Sosias's anvil, one blow a coin - on his mark it comes out crisp, near it the satyr gets two noses; fish salted in troughs on the beach and a fifteenth find there, a jar of salted fish; a Scythian trader from the steppe on the agora with his furs and his horse, and the sixteenth find, gold plaques for a Scythian coat (after the Kul-Oba kurgan); Scythian horsemen riding between the kurgans; an altar of Apollo on the hill, where the priest pours at the morning fire; the town keeps its hours - a busy morning agora, an empty one at midday with old men in the stoa's shade, pack donkeys on the Street of Jars, and after dark a supper party behind a lit door, voices and the aulos; fishing boats and dolphins on the strait.

          **Windows:** unzip and run \`Panticapaeum.exe\`. It is not code-signed: if SmartScreen says "Windows protected your PC", click *More info* → *Run anyway*. If it does not start, run \`Panticapaeum.console.exe\` to see the engine log.
          **Linux:** \`tar xzf\` and run \`./panticapaeum.x86_64\`.
          **Browser:** https://stadytady.github.io/metridat-game/

          Controls: start screen: click, Enter or E (Continue or New walk when a walk is saved). WASD move, mouse look, Shift run, Space jump, E inspect / talk / light / sleep / play knucklebones with the children, J journal of finds (with hints), Tab the way-book (goals, errands, achievements), Esc pause (language, volume, sensitivity, field of view, PS1 effects, Controls - move any key), F3 performance overlay. In a find's panel: drag to turn it, wheel to zoom.
          Gamepad: left stick walk, right stick look (and turn a find), A use, X jump, LB run, Y journal, Select way-book, Start pause, B back.
          Measure performance: \`Panticapaeum.exe -- --benchmark\` (results in \`%APPDATA%\\Godot\\app_userdata\\Panticapaeum- Echoes of the Bosporus\\benchmark.txt\`).

          Checked in CI: unit tests, short QA scenarios from mid-walk states (night in town, errands, the gamepad through real button events, saving and restoring) and a scripted walkthrough of the whole scene, then the same walkthrough in the unpacked release packages: Linux natively, Windows under Wine. Not checked: a real gamepad, a Steam Deck, a range of GPUs.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$TARGET" --title "Panticapaeum ${TAG}" --notes-file "$notes"
          fi
