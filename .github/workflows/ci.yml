name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.5.1

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot
        run: |
          tools/install-godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Unit tests and scripted walkthrough
        run: tools/test.sh

  export:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-windows-linux
      - name: Install Godot and templates
        run: |
          tools/install-godot.sh --templates
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Export Windows and Linux
        run: tools/export.sh windows linux
      - name: Smoke-test the exported pack (Linux build, same resources)
        run: |
          out="$(build/linux/panticapaeum.x86_64 --headless --fixed-fps 60 -- --walkthrough 2>&1)"
          echo "$out" | grep -E 'inspected|audio:|FAIL|WALKTHROUGH'
          echo "$out" | grep -q "WALKTHROUGH PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: panticapaeum-windows-x86_64
          path: build/windows/Panticapaeum.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: panticapaeum-linux-x86_64
          path: build/linux/panticapaeum.x86_64
          if-no-files-found: error

  screenshots:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot and software Vulkan
        run: |
          tools/install-godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb
      - name: Render viewpoints with Forward+ (lavapipe)
        run: |
          godot --headless --path . --import >/dev/null 2>&1 || true
          tools/shots.sh build/shots | grep -E 'shot|perf'
      - uses: actions/upload-artifact@v4
        with:
          name: panticapaeum-screenshots
          path: build/shots/*.png
          if-no-files-found: error
