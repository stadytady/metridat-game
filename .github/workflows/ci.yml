name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.5.1

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot
        run: |
          tools/install-godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Unit tests, QA scenarios and scripted walkthrough
        run: tools/test.sh
      - name: QA report (index.html, JSON, console log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panticapaeum-qa-report
          path: build/qa
          if-no-files-found: warn

  export:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-windows-linux-web
      - name: Install Godot and templates
        run: |
          tools/install-godot.sh --templates
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Export Windows, Linux and Web
        run: tools/export.sh windows linux web
      - name: Package like a release
        run: tools/package.sh "ci-${GITHUB_SHA::7}"
      - name: Install Wine (to run the Windows build) and ffmpeg (site poster)
        # The Ubuntu mirror sometimes stalls for many minutes: give each try a
        # deadline and try again, rather than hang until the job times out.
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            if timeout 180 sudo apt-get update -qq -o Acquire::Retries=3 &&
               timeout 300 sudo apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 wine wine64 xvfb ffmpeg; then
              break
            fi
            echo "apt attempt $i stalled or failed, retrying"
            sleep 15
          done
          command -v wine
      - name: Smoke-test the packages (Linux natively, Windows under Wine)
        run: tools/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: panticapaeum-windows-x86_64
          path: dist/*-windows-x86_64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          # a .tar.gz inside the artifact zip, so the executable bit survives
          name: panticapaeum-linux-x86_64
          path: dist/*-linux-x86_64.tar.gz
          if-no-files-found: error
      - name: Assemble Pages site
        run: tools/site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  pages:
    # Needs Settings -> Pages -> Source: GitHub Actions (enabled once by the owner).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: export
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  screenshots:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot and software Vulkan
        run: |
          tools/install-godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb
      - name: Render viewpoints with Forward+ (lavapipe)
        run: |
          godot --headless --path . --import >/dev/null 2>&1 || true
          tools/shots.sh build/shots | grep -E 'shot|perf'
      - uses: actions/upload-artifact@v4
        with:
          name: panticapaeum-screenshots
          path: build/shots/*.png
          if-no-files-found: error
